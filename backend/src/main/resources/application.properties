spring.datasource.url=jdbc:mysql://localhost:3306/roomievibe_db
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

jwt.expiration=86400000

google.client-id=128344598758-uqp7k0151r42fcvtpnsu0p69l12i75v6.apps.googleusercontent.com

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

vnp.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp.returnUrl=http://localhost:5173/wallet/topup-result

# Rate limit chong spam dang ky / brute-force dang nhap / spam dang tin
app.ratelimit.register.max=5
app.ratelimit.register.window-minutes=10
app.ratelimit.login.max-failed=5
app.ratelimit.login.window-minutes=15
app.ratelimit.listing.max=10
app.ratelimit.listing.window-hours=24
app.ratelimit.ai-search.max=15
app.ratelimit.ai-search.window-minutes=10

gemini.model=gemini-3.5-flash-lite
# gemini.api-key khong khai bao o day - them dong "gemini.api-key=<key-cua-ban>"
# (lay free tai aistudio.google.com) vao file application-local.properties (gitignored)

# Gui email tai khoan (chao mung, quen mat khau, khoa/mo khoa) qua Gmail SMTP.
# spring.mail.username / spring.mail.password (mat khau ung dung 16 ky tu) dat trong application-local.properties.
# De trong username thi email chi duoc ghi ra log (tien test link dat lai mat khau khi dev).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-name=RoomieVibe
app.frontend-url=http://localhost:5173
app.password-reset.valid-minutes=30
app.ratelimit.forgot-password.max=5
app.ratelimit.forgot-password.window-minutes=15

# Chua mat khau DB, jwt.secret, cloudinary keys, vnp.tmnCode, vnp.hashSecret, gemini.api-key, goong.api-key - xem application-local.properties (gitignored)
spring.config.import=optional:application-local.properties
